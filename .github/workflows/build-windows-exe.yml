name: build-windows-exe

# 在 GitHub 的 Windows runner 上构建真正的 .exe（Linux 上无法交叉编译 Windows 程序）。
# 触发方式：
#   1) 网页 Actions → build-windows-exe → Run workflow
#   2) push 到 main 且改动了 webapp/scripts/models 时自动触发
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "打包模式：onedir（推荐，启动快）/ onefile（单文件，启动慢）"
        default: onedir
        type: choice
        options: [onedir, onefile]
      bundle_full:
        description: "是否额外打包 full 预设（+109 MB）"
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "scripts/**"
      - "models/**"
      - ".github/workflows/build-windows-exe.yml"
      - "requirements.txt"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BUILD_MODE: ${{ inputs.mode || 'onedir' }}
      BUNDLE_FULL: ${{ inputs.bundle_full && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖（CPU 版 torch，避免打包 CUDA）
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib flask pyinstaller
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --clean webapp/packaging/ppg_workbench.spec

      - name: 冒烟测试（启动 exe → 健康检查 → 一键自检 → 文件上传推理）
        shell: pwsh
        run: |
          if ("$env:BUILD_MODE" -eq "onefile") { $exe = "dist\PPG-Workbench.exe" } else { $exe = "dist\PPG-Workbench\PPG-Workbench.exe" }
          Write-Host "exe = $exe"
          if (-not (Test-Path $exe)) { throw "未找到 exe：$exe" }

          # 生成一个测试输入（含参考真值；脚本化避免 YAML 块内嵌代码缩进问题）
          python webapp/packaging/gen_test_npz.py test_input.npz

          $p = Start-Process -FilePath $exe -ArgumentList "--no-browser","--port","8123" -PassThru
          Start-Sleep -Seconds 15
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:8123/api/health" -TimeoutSec 5
              $ok = $true; break
            } catch { Start-Sleep -Seconds 3 }
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "健康检查失败（exe 未启动）" }
          Write-Host "health:" ($h | ConvertTo-Json -Compress)

          $sc = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8123/api/selfcheck" -TimeoutSec 300
          Write-Host "selfcheck:" ($sc | ConvertTo-Json -Compress)
          if (-not $sc.ok) { Stop-Process -Id $p.Id -Force; throw "自检失败" }

          $resp = curl.exe -s -X POST "http://127.0.0.1:8123/api/denoise" -F "source=file" -F "file=@test_input.npz" -F "preset=lite" -F "want_hr=1"
          Write-Host "denoise:" $resp.Substring(0, [Math]::Min(600, $resp.Length))
          $j = $resp | ConvertFrom-Json
          if (-not $j.ok) { Stop-Process -Id $p.Id -Force; throw "文件上传推理失败" }
          Write-Host ("file-upload PRD: raw={0} clean={1}" -f $j.reference_metrics.raw.prd, $j.reference_metrics.clean.prd)
          Stop-Process -Id $p.Id -Force

      - name: 压缩分发包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if ("$env:BUILD_MODE" -eq "onefile") {
            Compress-Archive -Force -Path "dist\PPG-Workbench.exe" -DestinationPath "dist\PPG-Workbench-Windows-$env:BUILD_MODE.zip"
          } else {
            Compress-Archive -Force -Path "dist\PPG-Workbench\*" -DestinationPath "dist\PPG-Workbench-Windows-$env:BUILD_MODE.zip"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PPG-Workbench-Windows-${{ inputs.mode || 'onedir' }}
          path: dist/PPG-Workbench-Windows-*.zip
          retention-days: 30
