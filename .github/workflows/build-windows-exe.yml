name: build-windows-exe

# 在 GitHub 的 Windows runner 上构建**单文件（onefile）+ 无控制台**的 .exe，v1 与 v2 各一个。
# 触发：Actions → build-windows-exe → Run workflow；或 push 改动 webapp*/scripts/models 时自动触发。
on:
  workflow_dispatch:
    inputs:
      bundle_full:
        description: "是否额外打包 full 预设（+109 MB）"
        default: false
        type: boolean
  push:
    branches: [main, app]
    paths:
      - "webapp/**"
      - "webapp_v1/**"
      - "scripts/**"
      - "models/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [v1, v2]
    env:
      VARIANT: ${{ matrix.variant }}
      BUNDLE_FULL: ${{ inputs.bundle_full && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖（CPU 版 torch，避免打包 CUDA）
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib flask pyinstaller
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: PyInstaller 打包（onefile · 无控制台）
        run: pyinstaller --noconfirm --clean webapp/packaging/ppg_workbench_onefile.spec

      - name: 冒烟测试（启动单文件 exe → 健康检查 → 自检 → 文件上传 → 退出接口）
        shell: pwsh
        run: |
          $exe = "dist\PPG-Workbench-$env:VARIANT.exe"
          Write-Host "exe = $exe"
          if (-not (Test-Path $exe)) { throw "未找到 exe：$exe" }
          Write-Host ("大小: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB))

          python webapp/packaging/gen_test_npz.py test_input.npz

          # onefile 首次启动需要解压（可能 20–60 s），给足等待时间
          $p = Start-Process -FilePath $exe -ArgumentList "--no-browser","--port","8123" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:8123/api/health" -TimeoutSec 5
              $ok = $true; break
            } catch { }
          }
          if (-not $ok) { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }; throw "健康检查失败（exe 未启动）" }
          Write-Host ("health: {0}" -f ($h | ConvertTo-Json -Compress))

          $sc = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8123/api/selfcheck" -TimeoutSec 300
          Write-Host ("selfcheck: {0}" -f ($sc | ConvertTo-Json -Compress))
          if (-not $sc.ok) { Stop-Process -Id $p.Id -Force; throw "自检失败" }

          $resp = curl.exe -s -X POST "http://127.0.0.1:8123/api/denoise" -F "source=file" -F "file=@test_input.npz" -F "preset=lite" -F "want_hr=1"
          $j = $resp | ConvertFrom-Json
          if (-not $j.ok) { Stop-Process -Id $p.Id -Force; throw "文件上传推理失败" }
          Write-Host ("upload: synthetic={0} hr={1}" -f $j.synthetic, $j.result.hr_median)

          # 退出接口（无控制台版唯一的正常退出方式）
          try { Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8123/api/shutdown" -TimeoutSec 10 | Out-Null } catch { }
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw "退出接口未生效" }
          Write-Host "shutdown: OK（进程已退出）"

      - name: 压缩为单文件压缩包
        shell: pwsh
        run: |
          $zip = "dist/PPG-Workbench-$env:VARIANT-windows.zip"
          Compress-Archive -Force -Path "dist\PPG-Workbench-$env:VARIANT.exe" -DestinationPath $zip
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PPG-Workbench-${{ matrix.variant }}-windows
          path: dist/PPG-Workbench-${{ matrix.variant }}-windows.zip
          retention-days: 30

