name: release-windows

# 打 tag（v*）→ 在 Windows runner 上构建 v1/v2 单文件 exe → 自动创建 GitHub Release 并附上两个 zip + 校验和。
# 用法：git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # 也允许手动触发（使用下面的 tag 名）
    inputs:
      tag_name:
        description: "要发布的 tag（例如 v2.0.0；手动触发时必填）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [v1, v2]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖（CPU 版 torch）
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib flask pyinstaller
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: PyInstaller 打包（onefile · 无控制台）
        run: pyinstaller --noconfirm --clean webapp/packaging/ppg_workbench_onefile.spec

      - name: 冒烟测试（启动 → 健康 → 自检 → 上传 → 退出接口）
        shell: pwsh
        run: |
          $exe = "dist\PPG-Workbench-$env:VARIANT.exe"
          if (-not (Test-Path $exe)) { throw "未找到 exe：$exe" }
          Write-Host ("大小: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB))
          python webapp/packaging/gen_test_npz.py test_input.npz
          $p = Start-Process -FilePath $exe -ArgumentList "--no-browser","--port","8123" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            try { $h = Invoke-RestMethod -Uri "http://127.0.0.1:8123/api/health" -TimeoutSec 5; $ok = $true; break } catch { }
          }
          if (-not $ok) { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }; throw "健康检查失败" }
          $sc = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8123/api/selfcheck" -TimeoutSec 300
          if (-not $sc.ok) { Stop-Process -Id $p.Id -Force; throw "自检失败" }
          $resp = curl.exe -s -X POST "http://127.0.0.1:8123/api/denoise" -F "source=file" -F "file=@test_input.npz" -F "preset=lite" -F "want_hr=1"
          $j = $resp | ConvertFrom-Json
          if (-not $j.ok) { Stop-Process -Id $p.Id -Force; throw "文件上传失败" }
          try { Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8123/api/shutdown" -TimeoutSec 10 | Out-Null } catch { }
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw "退出接口未生效" }

      - name: 压缩
        shell: pwsh
        run: |
          $zip = "dist/PPG-Workbench-$env:VARIANT-windows.zip"
          Compress-Archive -Force -Path "dist\PPG-Workbench-$env:VARIANT.exe" -DestinationPath $zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.variant }}
          path: dist/PPG-Workbench-${{ matrix.variant }}-windows.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "release-*"
          path: artifacts
          merge-multiple: true

      - name: 校验和
        run: |
          ls -lh artifacts/
          cd artifacts && sha256sum *.zip | tee SHA256SUMS.txt

      - name: 创建 Release 并上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          echo "发布 tag：$TAG"
          gh release create "$TAG" \
            artifacts/PPG-Workbench-v1-windows.zip \
            artifacts/PPG-Workbench-v2-windows.zip \
            artifacts/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --title "PPG 运动伪影去除 · Web 工作台 $TAG" \
            --notes-file - <<'NOTES'
          ## 两个单文件免安装版（Windows x64，双击即用，无需 Python）

          | 文件 | 版本 | 说明 |
          |---|---|---|
          | `PPG-Workbench-v1-windows.zip` | 原始版 v1.0 | 合成正弦演示、演示态显示 PRD（用于对照） |
          | `PPG-Workbench-v2-windows.zip` | 增强版 v2.0 | 真实形态演示 + 演示态「链路自检」+ 静息旁路演示 |

          **使用**：解压后双击 exe → 自动打开浏览器（无控制台窗口）；首次启动解压约 20–60 s；
          **退出**：网页右上角 ⏻（或任务管理器结束进程）；日志在同目录 `workbench.log`。
          演示数据已内置；外部数据通过网页上传（`.npz/.csv/.json`）。

          **校验**：见 `SHA256SUMS.txt`。
          NOTES
